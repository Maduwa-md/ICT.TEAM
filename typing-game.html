<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Typing Game</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#2193b0,#6dd5ed);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.game{
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    padding:30px;
    border-radius:20px;
    width:400px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

h1{
    color:#0077cc;
}

#word{
    font-size:32px;
    font-weight:bold;
    margin:20px;
}

input{
    width:90%;
    padding:12px;
    font-size:20px;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    font-size:18px;
}

button{
    margin-top:20px;
    padding:10px 20px;
    font-size:18px;
    background:#0077cc;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#005fa3;
}
</style>
</head>

<body>

<div class="game">

<h1>⌨ ICT Typing Game</h1>

<p>Type the ICT word before the timer ends!</p>

<div id="word">Keyboard</div>

<input type="text" id="input" placeholder="Type here..." autofocus>

<div class="info">
<span>Score: <span id="score">0</span></span>
<span>Time: <span id="time">60</span>s</span>
</div>

<button onclick="restartGame()">Play Again</button>

</div>

<script>

const words=[
"Keyboard","Monitor","Mouse","CPU","RAM",
"Printer","Scanner","Internet","Network",
"Software","Hardware","Browser","Database",
"Laptop","Router"
];

let score=0;
let time=60;

const word=document.getElementById("word");
const input=document.getElementById("input");
const scoreText=document.getElementById("score");
const timeText=document.getElementById("time");

function newWord(){
word.textContent=words[Math.floor(Math.random()*words.length)];
}

input.addEventListener("input",function(){

if(input.value===word.textContent){

score++;
scoreText.textContent=score;

input.value="";

newWord();

}

});

function countdown(){

time--;

timeText.textContent=time;

if(time<=0){

clearInterval(timer);

alert("Game Over!\nYour Score = "+score);

input.disabled=true;

}

}

function restartGame(){

score=0;
time=60;

scoreText.textContent=0;
timeText.textContent=60;

input.disabled=false;
input.value="";
input.focus();

newWord();

clearInterval(timer);
timer=setInterval(countdown,1000);

}

newWord();

let timer=setInterval(countdown,1000);

</script>

</body>
  </html>
