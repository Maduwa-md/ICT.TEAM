<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ICT Mini Games</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b1220;
    color:white;
}

.container{
    width:90%;
    margin:auto;
    padding:40px 0;
}

h1{
    text-align:center;
    font-size:40px;
    margin-bottom:30px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#172033;
    padding:25px;
    border-radius:20px;
    text-align:center;
    transition:.3s;
    border:1px solid #26334d;
}

.card:hover{
    transform:translateY(-10px);
}

.icon{
    font-size:50px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#00d9ff;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#00a9cc;
}

#quizBox{
    display:none;
    margin-top:30px;
    background:#172033;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

.option{
    display:block;
    width:80%;
    margin:10px auto;
    padding:12px;
    background:#26334d;
    border-radius:10px;
    cursor:pointer;
}

.option:hover{
    background:#00d9ff;
    color:black;
}
</style>

</head>

<body>

<div class="container">

<h1>🎮 ICT Mini Games</h1>

<div class="games">

<div class="card">
<div class="icon">🖥️</div>
<h2>Computer Parts Quiz</h2>
<p>Computer parts හඳුනාගන්න</p>
<button onclick="startQuiz()">Play</button>
</div>


<div class="card">
<div class="icon">⌨️</div>
<h2>Typing Challenge</h2>
<p>Typing speed test</p>
<button onclick="alert('Coming Soon')">Play</button>
</div>


<div class="card">
<div class="icon">🔢</div>
<h2>Binary Game</h2>
<p>Binary numbers ඉගෙනගන්න</p>
<button onclick="alert('Coming Soon')">Play</button>
</div>


<div class="card">
<div class="icon">💻</div>
<h2>Coding Challenge</h2>
<p>HTML CSS Basics</p>
<button onclick="alert('Coming Soon')">Play</button>
</div>

</div>


<div id="quizBox">

<h2 id="question"></h2>

<div class="option" onclick="answer(0)" id="a0"></div>
<div class="option" onclick="answer(1)" id="a1"></div>
<div class="option" onclick="answer(2)" id="a2"></div>

<h3 id="score"></h3>

</div>


</div>


<script>

let questions=[
{
q:"CPU කියන්නේ?",
a:["Central Processing Unit","Computer Power User","Control Program Unit"],
c:0
},
{
q:"Keyboard එක කුමන වර්ගයේ device එකක්ද?",
a:["Input Device","Output Device","Storage Device"],
c:0
},
{
q:"HTML භාවිතා කරන්නේ?",
a:["Website හදන්න","Game play කරන්න","Photo edit කරන්න"],
c:0
}
];


let index=0;
let points=0;


function startQuiz(){

document.getElementById("quizBox").style.display="block";
loadQuestion();

}


function loadQuestion(){

let q=questions[index];

document.getElementById("question").innerHTML=q.q;

a0.innerHTML=q.a[0];
a1.innerHTML=q.a[1];
a2.innerHTML=q.a[2];

}


function answer(x){

if(x==questions[index].c){
points++;
}

index++;

if(index<questions.length){
loadQuestion();
}
else{

document.getElementById("score").innerHTML=
"🏆 Score : "+points+"/"+questions.length;

}

}

</script>

</body>
  </html>
