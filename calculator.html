<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Calculator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#071e3d,#1261a0,#00a8cc);
}

.calculator{
    width:340px;
    padding:22px;
    border-radius:25px;
    background:#111827;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.title{
    text-align:center;
    color:#00eaff;
    font-size:24px;
    font-weight:bold;
    margin-bottom:15px;
}

#display{
    width:100%;
    height:75px;
    border:0;
    outline:none;
    border-radius:15px;
    background:#020617;
    color:#fff;
    font-size:32px;
    text-align:right;
    padding:15px;
    margin-bottom:15px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:60px;
    border:0;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    background:#1f2937;
    color:white;
}

button:active{
    transform:scale(.94);
}

.operator{
    background:#0066ff;
}

.clear{
    background:#dc2626;
}

.equal{
    background:#00a878;
}

.zero{
    grid-column:span 2;
}
</style>
</head>

<body>

<div class="calculator">

<div class="title">🧮 ICT Calculator</div>

<input id="display" type="text" value="0" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="deleteLast()">⌫</button>
<button onclick="add('%')">%</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button class="zero" onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

</div>
</div>

<script>

let display=document.getElementById("display");

function add(value){

    if(display.value==="0"){
        display.value=value;
    }else{
        display.value+=value;
    }

}

function clearDisplay(){
    display.value="0";
}

function deleteLast(){

    if(display.value.length>1){
        display.value=display.value.slice(0,-1);
    }else{
        display.value="0";
    }

}

function calculate(){

    try{
        let result=Function(
            '"use strict"; return (' + display.value + ')'
        )();

        display.value=result;

    }catch{
        display.value="Error";
    }

}

</script>

</body>
  </html>
